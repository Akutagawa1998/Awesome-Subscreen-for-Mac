  <small>LOCAL MAC DISPLAY · PERSONAL USE</small>
  <h1>Wokyis Personal Calendar</h1>
  <p>这是在本人 Mac 上运行的个人小屏日历。它将本人授权的多个 Google 账号日程合并显示，并使用上海时区。</p>
  <p>Google OAuth 配置名称为 <strong>kiwi-dev</strong>。日历接入仅请求邮箱身份与日历只读权限，用于识别账号、读取日历列表和日程；不会创建、修改或删除日历事件。</p>
  <p>操作台服务只监听本机回环地址。此网站只是应用说明页，不提供登录或日程展示；实际连接由本机应用在 Google 官方授权页面完成。</p>
  <p><a href="privacy.html">日历接入隐私说明</a> · <a href="https://github.com/Akutagawa1998/Awesome-Subscreen-for-Mac">源代码与使用说明</a></p>
